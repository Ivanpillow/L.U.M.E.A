<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumea</title>
    <meta name="description" content="" />
    <meta name="theme-color" content="#0B132B" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B132B'/%3E%3Ccircle cx='16' cy='16' r='11' fill='%23D97706'/%3E%3Ccircle cx='20' cy='13' r='7.500' fill='%230B132B'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" />
  </head>
  <body>
    <!-- Todos los textos se inyectan desde src/i18n.ts (data-i18n / data-i18n-aria / data-i18n-tip). -->
    <div id="app">
      <aside id="panel" data-i18n-aria="aria.panel">
        <!-- 1. Logo, nombre y propuesta de valor -->
        <header class="brand">
          <div class="brand-row">
            <span id="logo" class="logo"></span>
            <h1>Lumea</h1>
            <div id="lang" class="lang" role="group"></div>
          </div>
          <p class="tagline" data-i18n="brand.tagline"></p>
        </header>

        <div class="needs-mode">
          <!-- 2–3. Destino y misión -->
          <section class="pickers">
            <div class="picker-row">
              <button id="pick-dest" type="button" class="picker" aria-haspopup="true" aria-controls="pick-panel"></button>
              <button id="pick-mission" type="button" class="picker" aria-haspopup="true" aria-controls="pick-panel"></button>
            </div>
            <div id="pick-panel" class="pick-panel" role="group" hidden></div>
          </section>

          <!-- 4. Meses -->
          <section>
            <h2 data-i18n="side.when"></h2>
            <div class="when">
              <button id="month-best" type="button" class="when-best"></button>
              <button id="month-pick" type="button" class="when-pick" aria-controls="month-grid"></button>
            </div>
            <div id="month-grid" class="month-grid" hidden></div>
            <p id="month-note" class="note"></p>
          </section>

          <!-- 5. Qué estás viendo -->
          <section>
            <h2 data-i18n="side.what"></h2>
            <div id="what" class="what"></div>
          </section>

          <!-- 6. Especificaciones -->
          <section>
            <details class="acc" id="specs">
              <summary><span data-i18n="side.specs"></span></summary>
              <div id="specs-body" class="specs"></div>
            </details>
          </section>

          <!-- 7. Ranking -->
          <section>
            <details class="acc" id="rank" open>
              <summary><span data-i18n="side.cands"></span></summary>
              <p class="note" id="cand-hint"></p>
              <ol id="cands" class="cands"></ol>
            </details>
          </section>

          <!-- 8. Modo avanzado -->
          <section>
            <details class="acc adv">
              <summary><span data-i18n="side.adv"></span></summary>
              <p class="note" data-i18n="adv.hint"></p>
              <button id="reset" type="button" class="btn small" data-i18n="side.weights.reset"></button>
              <div id="weights" class="weights"></div>
            </details>
          </section>
        </div>

        <footer class="panel-foot">
          <p class="note" data-i18n="side.data"></p>
        </footer>
      </aside>

      <main id="map" data-i18n-aria="aria.map"></main>
      <button id="btn-method" type="button" class="map-info" data-i18n-aria="map.method" data-i18n-tip="map.method"></button>
      <button id="btn-continents" type="button" class="map-info map-goto" aria-haspopup="true" aria-expanded="false" aria-controls="continents" data-i18n-aria="map.goto" data-i18n-tip="map.goto"></button>
      <div id="continents" class="map-menu" role="menu" data-i18n-aria="map.goto" hidden></div>
      <div id="legend" class="legend needs-mode" aria-hidden="true"></div>
      <article id="card" class="card" hidden aria-live="polite"></article>
      <dialog id="method" class="method"></dialog>
      <div id="loading" class="loading" data-i18n="loading"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
